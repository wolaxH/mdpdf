[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/mdpdf"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[workspace.dependencies]
mdparse = { path = "crates/mdparse" }
md2typst = { path = "crates/md2typst" }

# 所有 typst-* 必須鎖在同一版本，升版時一起處理。
typst = "=0.15.1"
typst-pdf = "=0.15.1"
typst-kit = { version = "=0.15.1", default-features = false }
typst-layout = "=0.15.1"

anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
zstd = "0.13"
mitex = "0.2.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
insta = "1"

# typst 在 debug 模式下非常慢；相依套件一律最佳化，自己的 crate 保持快速編譯。
[profile.dev.package."*"]
opt-level = 2

# build.rs 會用 zstd -19 壓縮內嵌字型，不最佳化會非常慢。
[profile.dev.build-override]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
