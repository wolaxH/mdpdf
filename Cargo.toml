[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/mdpdf"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[workspace.dependencies]
mdparse = { path = "crates/mdparse" }
md2typst = { path = "crates/md2typst" }

# All typst-* crates must be pinned to the same version and upgraded together.
typst = "=0.15.1"
typst-pdf = "=0.15.1"
typst-kit = { version = "=0.15.1", default-features = false }
typst-layout = "=0.15.1"

anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
zstd = "0.13"
mitex = "0.2.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
insta = "1"

# typst is very slow in debug builds: optimize all dependencies, keep our own crates fast to compile.
[profile.dev.package."*"]
opt-level = 2

# build.rs compresses the embedded fonts with zstd -19, which is very slow unoptimized.
[profile.dev.build-override]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
