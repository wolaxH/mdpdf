# cargo-fuzz targets. Not part of the main workspace; needs a nightly toolchain:
#   rustup toolchain install nightly && cargo install cargo-fuzz
#   cargo +nightly fuzz run parse
[package]
name = "mdpdf-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
mdparse = { path = "../crates/mdparse" }
md2typst = { path = "../crates/md2typst" }

# Keep this crate out of the parent workspace.
[workspace]
members = ["."]

[[bin]]
name = "parse"
path = "fuzz_targets/parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "codegen"
path = "fuzz_targets/codegen.rs"
test = false
doc = false
bench = false
